// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.20' apply false
    id 'org.jetbrains.kotlin.kapt' version '2.1.20' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.20' apply false
    id 'org.jetbrains.kotlin.plugin.parcelize' version '2.1.20' apply false
    id 'com.google.dagger.hilt.android' version '2.51.1' apply false
    id 'com.google.gms.google-services' version '4.4.2' apply false
}

ext {
    kotlinVersion = '2.1.20'
}

// Hilt 2.51.1's kapt bundles kotlinx-metadata-jvm that only understands Kotlin metadata ≤ 2.1.
// Recent AndroidX cuts (core-ktx 1.18, appcompat 1.7.1, activity 1.13, material 1.13, ...) ship
// kotlin-stdlib 2.2.x metadata and make Hilt's annotation processor throw:
//   "Provided Metadata instance has version 2.2.0, while maximum supported version is 2.1.0"
// Pinning stdlib back to the compiler version fixes it until we upgrade Hilt (mirrors the SDK repo).
subprojects {
    configurations.configureEach { cfg ->
        cfg.resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                    details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion(rootProject.ext.kotlinVersion)
                details.because('Align Kotlin stdlib metadata with compiler (Hilt kapt)')
            }
        }
    }
}
