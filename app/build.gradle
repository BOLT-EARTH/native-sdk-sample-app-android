plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.example.testinguisdkgithub'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.testinguisdkgithub"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Bolt SDK static API token (`token` header). Set in ~/.gradle/gradle.properties or project
        // gradle.properties as BOLT_SDK_APP_TOKEN=... — never commit production secrets.
        def boltSdkHostToken = project.findProperty('BOLT_SDK_APP_TOKEN') ?: ''
        buildConfigField 'String', 'BOLT_SDK_APP_TOKEN', "\"${boltSdkHostToken}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    // bolt-earth-ui-sdk transitively depends on :chargerBooking which uses data binding.
    // Without this, inflating library layouts crashes with NoClassDefFoundError: DataBinderMapperImpl.
    // buildConfig required so BuildConfig.DEBUG is generated for gating the SDK's network logging.
    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }
}

kapt {
    correctErrorTypes true
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "androidx.navigation:navigation-fragment-ktx:2.8.0"
    implementation "androidx.navigation:navigation-ui-ktx:2.8.0"

    // Hilt — required because bolt-earth-ui-sdk exposes @AndroidEntryPoint fragments that the
    // host app's Hilt annotation processor must aggregate at build time.
    implementation "com.google.dagger:hilt-android:2.51.1"
    kapt "com.google.dagger:hilt-android-compiler:2.51.1"

    // Gson — used to build BoltEarthUserSession payloads for initialize().
    implementation "com.google.code.gson:gson:2.10.1"
    implementation("io.github.boltearth:bolt-earth-ui-sdk:1.0.3")

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
